<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Knowledge Base · lidar.rentals</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
<button id="menu" aria-label="Menu" hidden>☰</button>
<a class="logo" href="#" id="home">lidar<i>.</i>rentals<small>Knowledge Base</small></a>
<div class="sw" id="sw" hidden><input id="q" type="search" placeholder="Search articles…" autocomplete="off"></div>
<div class="who" id="whobox" hidden><span id="who"></span><button id="out" type="button">Sign out</button></div>
</header>

<section id="auth">
  <form id="login" class="card login" autocomplete="on">
    <h1>Sign in</h1>
    <p>This knowledge base is for lidar.rentals customers. Use the email address you were invited with.</p>
    <label>Email<input id="email" type="email" required autocomplete="email"></label>
    <label>Password<input id="pw" type="password" autocomplete="current-password"></label>
    <p id="msg" role="alert"></p>
    <div class="row"><button class="primary" type="submit">Sign in</button><button type="button" id="link">Email me a sign-in link</button></div>
  </form>
</section>

<div id="app" class="wrap" hidden><aside id="nav"></aside><main id="main"></main></div>
<footer>© lidar.rentals · Documentation content © Exyn Technologies. All rights reserved. Nexys and ExynView are trademarks of their respective owner.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
